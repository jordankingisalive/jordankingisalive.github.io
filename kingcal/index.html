<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>King Family Calendar</title>
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f8fafc; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b; --accent:#4f46e5;
  --boy:#2563eb; --boy-soft:#e8f0ff;
  --girl:#ec4899; --girl-soft:#ffe9f4;
  --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1020; --surface:#131a2b; --surface-2:#182136; --border:#27324a;
    --text:#e8edf7; --muted:#97a3bb; --accent:#8b8cf7;
    --boy-soft:#16243f; --girl-soft:#3a1730;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- Passcode gate ---------- */
#gate{
  position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
  padding:24px; background:linear-gradient(135deg,#2563eb,#7c3aed 45%,#ec4899);
}
.gate-card{
  background:var(--surface); border-radius:20px; box-shadow:var(--shadow);
  padding:32px 28px; inline-size:min(380px,100%); text-align:center;
}
.gate-card h1{margin:0 0 4px; font-size:22px}
.gate-card p{margin:0 0 20px; color:var(--muted); font-size:13px}
.gate-emoji{font-size:34px; letter-spacing:4px; display:block; margin-block-end:10px}
#code{
  inline-size:100%; padding:12px 14px; font-size:16px; text-align:center;
  border:1px solid var(--border); border-radius:10px; background:var(--surface-2); color:var(--text);
}
#gate button{
  margin-block-start:12px; inline-size:100%; padding:12px; border:0; border-radius:10px;
  background:var(--accent); color:#fff; font-weight:600;
}
#gateMsg{min-block-size:20px; color:#dc2626; font-size:13px; margin-block-start:10px}
.gate-remember{display:flex;align-items:center;justify-content:center;gap:8px;margin-block-start:14px;color:var(--muted);font-size:13px}

/* ---------- Shell ---------- */
#app{display:none}
.wrap{max-inline-size:1180px; margin-inline:auto; padding:16px}
header.top{
  background:var(--surface); border-block-end:1px solid var(--border);
  position:sticky; inset-block-start:0; z-index:20;
}
.top-inner{max-inline-size:1180px; margin-inline:auto; padding:12px 16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.brand{font-weight:700; font-size:18px; display:flex; align-items:center; gap:8px; margin-inline-end:auto}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.nav{display:flex; align-items:center; gap:6px}
.btn{
  border:1px solid var(--border); background:var(--surface); border-radius:10px;
  padding:7px 12px; font-size:14px; white-space:nowrap;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); color:#fff; border-color:transparent}
.seg{display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden}
.seg button{border:0; background:var(--surface); padding:7px 14px; font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff}
#periodLabel{font-size:17px; font-weight:700; min-inline-size:190px}
.filters{display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 12px; max-inline-size:1180px; margin-inline:auto}
.chipf{
  border:1.5px solid var(--border); background:var(--surface); border-radius:999px;
  padding:5px 12px; font-size:13px; display:inline-flex; align-items:center; gap:6px;
}
.chipf[aria-pressed="false"]{opacity:.42}
.chipf[data-kid="julian"][aria-pressed="true"]{border-color:var(--boy); background:var(--boy-soft)}
.chipf[data-kid="scarlett"][aria-pressed="true"]{border-color:var(--girl); background:var(--girl-soft)}

/* ---------- Month grid ---------- */
.dow{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-block-end:6px}
.dow div{text-align:center; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
.month{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.cell{
  background:var(--surface); border:1.5px solid var(--border); border-radius:12px;
  min-block-size:104px; padding:6px; display:flex; flex-direction:column; gap:4px; overflow:hidden;
}
.cell.out{opacity:.45}
.cell.today{box-shadow:0 0 0 2px var(--accent) inset}
.cell.has-boy{border-color:var(--boy)}
.cell.has-girl{border-color:var(--girl)}
.cell.has-both{border-color:transparent; background-image:linear-gradient(var(--surface),var(--surface)),linear-gradient(120deg,var(--boy),var(--girl)); background-origin:border-box; background-clip:padding-box,border-box; border-width:2px}
.daynum{font-size:12px; font-weight:700; color:var(--muted); display:flex; align-items:center; gap:5px}
.cell.today .daynum{color:var(--accent)}
.gameday-tag{font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#fff; background:#f59e0b; padding:1px 6px; border-radius:999px; white-space:nowrap}
.chip{
  text-align:start; inline-size:100%; border:0; border-inline-start:3px solid var(--border);
  border-radius:6px; padding:3px 6px; font-size:11.5px; line-height:1.25;
  background:var(--surface-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.chip.k-julian{border-inline-start-color:var(--boy); background:var(--boy-soft)}
.chip.k-scarlett{border-inline-start-color:var(--girl); background:var(--girl-soft)}
.more{font-size:11px; color:var(--muted); text-align:start; background:none; border:0; padding:0 6px}

/* ---------- Week / Day lists ---------- */
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:8px}
.wcol{background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:8px; min-block-size:150px}
.wcol.today{box-shadow:0 0 0 2px var(--accent) inset}
.wcol.has-both{border-color:transparent; background-image:linear-gradient(var(--surface),var(--surface)),linear-gradient(120deg,var(--boy),var(--girl)); background-origin:border-box; background-clip:padding-box,border-box; border-width:2px}
.wcol.has-boy{border-color:var(--boy)} .wcol.has-girl{border-color:var(--girl)}
.wcol h3{margin:0 0 6px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
.wcol h3 b{display:block; font-size:18px; color:var(--text)}
.ev{
  inline-size:100%; text-align:start; background:var(--surface-2); border:0;
  border-inline-start:4px solid var(--border); border-radius:8px; padding:8px 10px; margin-block-end:6px;
}
.ev.k-julian{border-inline-start-color:var(--boy); background:var(--boy-soft)}
.ev.k-scarlett{border-inline-start-color:var(--girl); background:var(--girl-soft)}
.ev .t{font-weight:600; font-size:13px}
.ev .m{font-size:12px; color:var(--muted)}
.daylist{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px}
.daylist .ev{padding:12px 14px}
.daylist .ev .t{font-size:15px}
.empty{color:var(--muted); font-size:14px; padding:18px; text-align:center}

/* ---------- Modal ---------- */
#modal, #addModal{position:fixed; inset:0; z-index:60; display:none; align-items:flex-end; justify-content:center; background:rgba(15,23,42,.45); padding:0}
#modal.open, #addModal.open{display:flex}
@media (min-width:640px){ #modal, #addModal{align-items:center; padding:24px} }
.sheet{
  background:var(--surface); inline-size:min(520px,100%); border-radius:18px 18px 0 0;
  max-block-size:92vh; overflow:auto; box-shadow:var(--shadow);
}
@media (min-width:640px){ .sheet{border-radius:18px} }
.sheet-hd{padding:18px 20px 12px; border-block-end:1px solid var(--border)}
.sheet-hd .eyebrow{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
.sheet-hd h2{margin:4px 0 6px; font-size:19px}
.sheet-bd{padding:16px 20px}
.row{display:flex; gap:10px; padding:8px 0; align-items:flex-start; font-size:14px}
.row .ic{inline-size:22px; text-align:center}
.row .lbl{color:var(--muted); font-size:12px}
.actions{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:4px 20px 20px}
.actions .btn{padding:11px; text-align:center; display:flex; align-items:center; justify-content:center; gap:7px}
.actions .btn.wide{grid-column:1 / -1}
.closeX{position:sticky; inset-block-start:0; float:inline-end; border:0; background:transparent; font-size:22px; padding:10px 14px; color:var(--muted)}
#toast{
  position:fixed; inset-block-end:24px; inset-inline:0; margin-inline:auto; inline-size:fit-content;
  background:#0f172a; color:#fff; padding:10px 18px; border-radius:999px; font-size:14px;
  opacity:0; pointer-events:none; transition:opacity .2s; z-index:90;
}
#toast.show{opacity:1}

/* ---------- Add Event modal ---------- */
.add-tabs{display:flex; gap:6px; margin-block-end:14px}
.add-tab{flex:1; border:1.5px solid var(--border); background:var(--surface); border-radius:10px; padding:9px; font-size:13px; text-align:center}
.add-tab[aria-pressed="true"]{border-color:var(--accent); background:var(--surface-2); font-weight:600; color:var(--accent)}
.dropzone{border:2px dashed var(--border); border-radius:12px; padding:26px 14px; text-align:center; color:var(--muted); font-size:13px}
.preview-img{max-inline-size:100%; max-block-size:220px; border-radius:10px; margin-block-end:10px; display:block; margin-inline:auto}
.add-textarea{inline-size:100%; min-block-size:140px; padding:10px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2); color:var(--text); font:inherit; resize:vertical}
.field{display:flex; flex-direction:column; gap:4px; margin-block-end:12px}
.field label{font-size:12px; color:var(--muted); font-weight:600}
.field input, .field select, .field textarea{padding:9px 10px; border:1px solid var(--border); border-radius:9px; background:var(--surface-2); color:var(--text); font:inherit}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.progress-wrap{text-align:center; padding:34px 10px; color:var(--muted); font-size:14px}
.spinner{inline-size:32px; block-size:32px; border:3px solid var(--border); border-block-start-color:var(--accent); border-radius:50%; margin:0 auto 14px; animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.raw-text-toggle{font-size:12px; color:var(--accent); background:none; border:0; padding:0; text-decoration:underline; margin-block-end:10px; display:block}
.raw-text-box{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px; font-size:12px; white-space:pre-wrap; color:var(--muted); margin-block-end:12px; max-block-size:180px; overflow:auto}
.err-msg{color:#dc2626; font-size:13px; margin-block-end:10px}

footer.foot{text-align:center; color:var(--muted); font-size:12px; padding:20px}
@media (max-width:760px){
  .month{gap:3px} .cell{min-block-size:76px; padding:4px; border-radius:9px}
  .chip{font-size:10px; padding:2px 4px}
  .week{grid-template-columns:1fr}
  #periodLabel{min-inline-size:auto; font-size:15px}
  .brand{font-size:16px}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <span class="gate-emoji">👦⚽ 👧🩰</span>
    <h1>King Family Calendar</h1>
    <p>Private family page — enter the code to continue.</p>
    <input id="code" type="password" inputmode="text" autocomplete="off" placeholder="Enter code" aria-label="Access code">
    <button id="gateBtn" type="button">Unlock</button>
    <label class="gate-remember"><input id="remember" type="checkbox" checked> Remember me on this device</label>
    <div id="gateMsg" role="status"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="top-inner">
      <div class="brand">👨‍👧‍👦 King Family Calendar<small>Julian &amp; Scarlett</small></div>
      <div class="nav">
        <button class="btn" id="prev" type="button" aria-label="Previous">‹</button>
        <button class="btn" id="today" type="button">Today</button>
        <button class="btn" id="next" type="button" aria-label="Next">›</button>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button type="button" data-view="day">Day</button>
        <button type="button" data-view="week">Week</button>
        <button type="button" data-view="month" aria-pressed="true">Month</button>
      </div>
      <div id="periodLabel"></div>
      <button class="btn" id="jump" type="button">Jump to…</button>
      <button class="btn primary" id="addEventBtn" type="button">📤 Add Event</button>
      <button class="btn" id="ghSetupBtn" type="button" title="Set up auto-save on this device" aria-label="Set up auto-save on this device">⚙️</button>
    </div>
    <div class="filters" id="filters">
      <button class="chipf" type="button" data-kid="julian" aria-pressed="true">👦 Julian</button>
      <button class="chipf" type="button" data-kid="scarlett" aria-pressed="true">👧 Scarlett</button>
      <button class="chipf" type="button" data-act="soccer" aria-pressed="true">⚽ Soccer</button>
      <button class="chipf" type="button" data-act="taekwondo" aria-pressed="true">🥷 Taekwondo</button>
      <button class="chipf" type="button" data-act="dance" aria-pressed="true">🩰 Dance</button>
      <button class="chipf" type="button" data-act="other" aria-pressed="true">📌 Other</button>
    </div>
  </header>

  <main class="wrap">
    <div id="view"></div>
  </main>
  <footer class="foot">Private family calendar · not listed, not indexed<br>v3 · updated Sep 22, 2026 · Gameday badges + Add Event (scan/paste)</footer>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <button class="closeX" id="mClose" type="button" aria-label="Close">×</button>
    <div class="sheet-hd">
      <div class="eyebrow" id="mEyebrow"></div>
      <h2 id="mTitle"></h2>
      <div class="m" id="mWhen" style="color:var(--muted);font-size:13px"></div>
    </div>
    <div class="sheet-bd" id="mBody"></div>
    <div class="actions" id="mActions"></div>
  </div>
</div>

<div id="addModal" role="dialog" aria-modal="true" aria-labelledby="addTitle">
  <div class="sheet">
    <button class="closeX" id="addClose" type="button" aria-label="Close">×</button>
    <div class="sheet-hd">
      <div class="eyebrow">Add an event</div>
      <h2 id="addTitle">Scan a screenshot or paste details</h2>
    </div>
    <div class="sheet-bd" id="addBody"></div>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function(){
"use strict";

/* ============ ACCESS CODE ============ */
var CODE = "Maack2026";
var KEY  = "kingcal.ok.v1";

function unlock(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  eventsReady.then(render);
}
function tryCode(){
  var v = document.getElementById("code").value.trim();
  if (v === CODE){
    if (document.getElementById("remember").checked){
      try { localStorage.setItem(KEY,"1"); } catch(e){}
    }
    unlock();
  } else {
    document.getElementById("gateMsg").textContent = "That code isn't right — try again.";
    document.getElementById("code").value = "";
    document.getElementById("code").focus();
  }
}
document.getElementById("gateBtn").addEventListener("click", tryCode);
document.getElementById("code").addEventListener("keydown", function(e){ if(e.key === "Enter") tryCode(); });

/* ============ REFERENCE DATA ============ */
var KIDS = {
  julian:   { name:"Julian",   emoji:"👦", color:"#2563eb", poss:"his" },
  scarlett: { name:"Scarlett", emoji:"👧", color:"#ec4899", poss:"her" }
};
var ACTS = {
  soccer:    { label:"Soccer",    emoji:"⚽" },
  taekwondo: { label:"Taekwondo", emoji:"🥷" },
  dance:     { label:"Dance",     emoji:"🩰" },
  other:     { label:"Other",     emoji:"📌" }
};
var VENUES = {
  sv:      { name:"Speedway Village",                   addr:"345 Speedway Cir, Lincoln, NE 68502" },
  lsf:     { name:"Lincoln Sports Foundation (LSF Campus)", addr:"7600 N 70th St, Lincoln, NE 68517" },
  fremont: { name:"Fremont-Christensen Soccer Complex", addr:"" }
};

/* ============ EVENTS ============
   Loaded at runtime from events.json (same folder) so the "Add Event" flow can
   commit new events straight to that file via the GitHub API.
   id, kid, act, type, title, date(YYYY-MM-DD), start, end, venue, field,
   jersey     — e.g. "Navy jersey"  (optional; shown + used in announcement)
   arrive     — "HH:MM" 24h         (optional; shown + used in announcement)
   parking    — free text           (optional; shown + used in announcement)
   bring      — free text override  (optional; defaults by activity)
   notes      — anything else       (optional)
   venueName/venueAddr — optional per-event venue override, used when venue isn't
                          one of the known VENUES keys (e.g. added via the scan flow) */
var EVENTS = [];
var EVENTS_CACHE_KEY = "kingcal.events.cache.v1";
var EVENTS_URL = "events.json";

function loadEvents(){
  return fetch(EVENTS_URL, {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("fetch-failed"); return r.json(); })
    .then(function(data){
      EVENTS = data;
      try { localStorage.setItem(EVENTS_CACHE_KEY, JSON.stringify(data)); } catch(e){}
    })
    .catch(function(){
      try {
        var cached = localStorage.getItem(EVENTS_CACHE_KEY);
        if (cached) EVENTS = JSON.parse(cached);
      } catch(e){}
    });
}
var eventsReady = loadEvents();

/* ============ GITHUB SAVE (Add Event flow) ============
   Lets the calendar commit new events straight to events.json so they show up
   for everyone, without a custom backend.

   SETUP (one-time, per device — click the ⚙️ button in the top nav):
   1. Go to https://github.com/settings/personal-access-tokens/new
   2. Resource owner: jordankingisalive · Repository access: Only this repository
      → jordankingisalive.github.io
   3. Permissions → Repository permissions → Contents: Read and write
   4. Generate, copy the token, click ⚙️ in the app, and paste it there.
   The token is stored only in this browser's localStorage — it's never part of
   the page's source and never committed to the repo (GitHub's push protection
   blocks secrets in commits anyway), so each device that should be able to
   auto-save needs the token entered once via ⚙️. */
var GH_OWNER  = "jordankingisalive";
var GH_REPO   = "jordankingisalive.github.io";
var GH_BRANCH = "main";
var GH_PATH   = "kingcal/events.json";
var GH_TOKEN_KEY = "kingcal.ghtoken.v1";

function getGhToken(){
  try { return localStorage.getItem(GH_TOKEN_KEY) || ""; } catch(e){ return ""; }
}
function setGhToken(v){
  try {
    if (v) localStorage.setItem(GH_TOKEN_KEY, v);
    else localStorage.removeItem(GH_TOKEN_KEY);
    return true;
  } catch(e){ return false; }
}

function b64EncodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUtf8(str){ return decodeURIComponent(escape(atob(str))); }

function saveEventToGitHub(ev){
  var token = getGhToken();
  if (!token) return Promise.reject(new Error("no-token"));
  var apiUrl = "https://api.github.com/repos/"+GH_OWNER+"/"+GH_REPO+"/contents/"+GH_PATH;
  var ghHeaders = { "Authorization":"Bearer "+token, "Accept":"application/vnd.github+json" };
  return fetch(apiUrl, { headers: ghHeaders })
    .then(function(r){ if(!r.ok) throw new Error("Couldn't reach GitHub to save."); return r.json(); })
    .then(function(file){
      var current = JSON.parse(b64DecodeUtf8(file.content.replace(/\n/g,"")));
      current.push(ev);
      var body = {
        message: "Add event: " + ev.title + " (" + ev.date + ")",
        content: b64EncodeUtf8(JSON.stringify(current, null, 2)),
        sha: file.sha,
        branch: GH_BRANCH
      };
      return fetch(apiUrl, { method:"PUT", headers: Object.assign({"Content-Type":"application/json"}, ghHeaders), body: JSON.stringify(body) });
    })
    .then(function(r){
      if (!r.ok) return r.json().then(function(j){ throw new Error(j.message || "GitHub rejected the save."); });
      return r.json();
    });
}

/* ============ HELPERS ============ */
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var DOWS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function pad(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseISO(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function startOfWeek(d){ return addDays(d, -d.getDay()); }
function fmt12(hhmm){
  var p=hhmm.split(":"), h=+p[0], m=p[1], ap = h>=12 ? "PM":"AM";
  h = h%12; if(h===0) h=12;
  return h+":"+m+" "+ap;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function venueOf(ev){
  if (ev.venueName) return { name: ev.venueName, addr: ev.venueAddr || "" };
  return VENUES[ev.venue] || {name:"", addr:""};
}
function placeLine(ev){
  var v = venueOf(ev);
  return v.name + (ev.field ? " — " + ev.field : "");
}
function fullAddress(ev){
  var v = venueOf(ev);
  return v.addr ? v.addr : v.name;
}
function mapsUrl(ev){
  return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(fullAddress(ev));
}
function eventText(ev){
  var d = parseISO(ev.date);
  var lines = [
    KIDS[ev.kid].emoji + " " + KIDS[ev.kid].name + " · " + ACTS[ev.act].emoji + " " + ACTS[ev.act].label + " " + ev.type,
    ev.title,
    DOWS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(),
    fmt12(ev.start) + " – " + fmt12(ev.end),
    placeLine(ev)
  ];
  if (fullAddress(ev)) lines.push(fullAddress(ev));
  if (ev.jersey)  lines.push("Wear: " + ev.jersey);
  if (ev.arrive)  lines.push("Arrive by " + fmt12(ev.arrive));
  if (ev.parking) lines.push("Parking: " + ev.parking);
  if (ev.notes)   lines.push(ev.notes);
  return lines.join("\n");
}

/* Plain-English name for the event, used inside the announcement sentence. */
function eventPhrase(ev){
  var t = (ev.type || "").toLowerCase();
  if (ev.act === "soccer")    return t === "game" ? "a soccer game" : "soccer " + (t || "practice");
  if (ev.act === "taekwondo") return t === "test" || t === "tournament" ? "a taekwondo " + t : "taekwondo " + (t || "class");
  if (ev.act === "dance")     return t === "recital" || t === "competition" ? "a dance " + t : "dance " + (t || "class");
  return ev.title;
}
/* What to bring / what to wear — jersey first, then gear by activity. */
function bringLine(ev){
  var parts = [];
  var kid = KIDS[ev.kid];
  if (ev.jersey) parts.push(kid.name + " will be in " + kid.poss + " " + ev.jersey.toLowerCase() + ".");
  if (ev.bring) parts.push(ev.bring);
  else if (ev.act === "soccer") parts.push("Bring chairs, an umbrella for shade, and a blanket if it's chilly.");
  else parts.push("Just bring yourself!");
  return parts.join(" ");
}
/* The shareable announcement, following the family template. */
function announcementFor(ev){
  var d = parseISO(ev.date);
  var kid = KIDS[ev.kid];
  var FULLDOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var dateStr = FULLDOW[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate();
  var timeStr = fmt12(ev.start) + " to " + fmt12(ev.end);

  var where = fullAddress(ev);
  // Field number only matters for field-based sports.
  if (ev.field && ev.act === "soccer") where += ", " + ev.field;

  var p1 = "Hey - " + kid.name + " has " + eventPhrase(ev) + " on " + dateStr +
           " from " + timeStr + ". It's at " + where + ".";
  if (ev.parking) p1 += " " + (/[.!?]$/.test(ev.parking) ? ev.parking : ev.parking + ".");

  var out = [p1];
  if (ev.arrive) out.push("We plan to arrive at " + fmt12(ev.arrive) + ".");
  out.push("What to bring and what to wear: " + bringLine(ev));
  out.push("Looking forward to seeing you!");
  out.push("The Kings");
  return out.join("\n\n");
}
function icsFor(ev){
  function stamp(dateStr, hhmm){ return dateStr.replace(/-/g,"") + "T" + hhmm.replace(":","") + "00"; }
  var body = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//King Family Calendar//EN","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    "UID:" + ev.id + "@kingcal",
    "DTSTART;TZID=America/Chicago:" + stamp(ev.date, ev.start),
    "DTEND;TZID=America/Chicago:" + stamp(ev.date, ev.end),
    "SUMMARY:" + KIDS[ev.kid].emoji + " " + KIDS[ev.kid].name + " — " + ev.title,
    "LOCATION:" + (fullAddress(ev) ? placeLine(ev) + ", " + fullAddress(ev) : placeLine(ev)),
    "DESCRIPTION:" + (ev.notes || "").replace(/\n/g,"\\n"),
    "END:VEVENT","END:VCALENDAR"
  ];
  return body.join("\r\n");
}
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._h); toast._h = setTimeout(function(){ t.classList.remove("show"); }, 1900);
}
function copyText(txt, okMsg){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast(okMsg); }, function(){ fallbackCopy(txt, okMsg); });
  } else { fallbackCopy(txt, okMsg); }
}
function fallbackCopy(txt, okMsg){
  var ta = document.createElement("textarea");
  ta.value = txt; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast(okMsg); } catch(e){ toast("Copy not supported here"); }
  document.body.removeChild(ta);
}

/* ============ STATE ============ */
var today = new Date(); today.setHours(0,0,0,0);
var cursor = new Date(today.getTime());
var view = "month";
var MIN = new Date(today.getFullYear()-1, 0, 1);
var MAX = new Date(today.getFullYear()+12, 11, 31);
var filters = { julian:true, scarlett:true, soccer:true, taekwondo:true, dance:true, other:true };

function visible(ev){ return filters[ev.kid] && filters[ev.act]; }
function eventsOn(dateStr){
  return EVENTS.filter(function(e){ return e.date === dateStr && visible(e); })
               .sort(function(a,b){ return a.start < b.start ? -1 : 1; });
}
function kidsOn(dateStr){
  var s = {};
  eventsOn(dateStr).forEach(function(e){ s[e.kid] = true; });
  return s;
}
function hasGame(dateStr){
  return eventsOn(dateStr).some(function(e){ return e.type === "Game"; });
}

/* ============ RENDER ============ */
function render(){
  document.querySelectorAll(".seg button").forEach(function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-view") === view ? "true" : "false");
  });
  if (view === "month") renderMonth();
  else if (view === "week") renderWeek();
  else renderDay();
}

function chipHtml(ev){
  return '<button type="button" class="chip k-'+ev.kid+'" data-id="'+ev.id+'" title="'+esc(ev.title)+'">'
       + KIDS[ev.kid].emoji + ACTS[ev.act].emoji + " " + esc(fmt12(ev.start)) + " " + esc(ev.type) + '</button>';
}
function evHtml(ev){
  return '<button type="button" class="ev k-'+ev.kid+'" data-id="'+ev.id+'">'
       + '<div class="t">' + KIDS[ev.kid].emoji + ACTS[ev.act].emoji + " " + esc(ev.title) + '</div>'
       + '<div class="m">' + esc(fmt12(ev.start)) + " – " + esc(fmt12(ev.end)) + " · " + esc(placeLine(ev))
       + (ev.jersey ? " · 👕 " + esc(ev.jersey) : "")
       + (ev.arrive ? " · ⏰ arrive " + esc(fmt12(ev.arrive)) : "")
       + (ev.parking ? " · 🅿️" : "")
       + '</div>'
       + '</button>';
}
function kidClass(k){
  if (k.julian && k.scarlett) return " has-both";
  if (k.julian) return " has-boy";
  if (k.scarlett) return " has-girl";
  return "";
}

function renderMonth(){
  document.getElementById("periodLabel").textContent = MONTHS[cursor.getMonth()] + " " + cursor.getFullYear();
  var first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  var gridStart = startOfWeek(first);
  var html = '<div class="dow">' + DOWS.map(function(d){ return "<div>"+d+"</div>"; }).join("") + '</div><div class="month">';
  for (var i=0;i<42;i++){
    var d = addDays(gridStart, i);
    var ds = iso(d);
    var evs = eventsOn(ds);
    var cls = "cell";
    if (d.getMonth() !== cursor.getMonth()) cls += " out";
    if (ds === iso(today)) cls += " today";
    cls += kidClass(kidsOn(ds));
    html += '<div class="'+cls+'"><div class="daynum">'+d.getDate()+(hasGame(ds) ? '<span class="gameday-tag">Gameday</span>' : '')+'</div>';
    evs.slice(0,3).forEach(function(e){ html += chipHtml(e); });
    if (evs.length > 3) html += '<button type="button" class="more" data-day="'+ds+'">+'+(evs.length-3)+' more</button>';
    html += '</div>';
  }
  html += '</div>';
  document.getElementById("view").innerHTML = html;
}

function renderWeek(){
  var s = startOfWeek(cursor), e = addDays(s,6);
  document.getElementById("periodLabel").textContent =
    MONTHS[s.getMonth()].slice(0,3)+" "+s.getDate()+" – "+MONTHS[e.getMonth()].slice(0,3)+" "+e.getDate()+", "+e.getFullYear();
  var html = '<div class="week">';
  for (var i=0;i<7;i++){
    var d = addDays(s,i), ds = iso(d), evs = eventsOn(ds);
    var cls = "wcol" + (ds===iso(today) ? " today":"") + kidClass(kidsOn(ds));
    html += '<div class="'+cls+'"><h3>'+DOWS[d.getDay()]+'<b>'+d.getDate()+'</b></h3>';
    html += evs.length ? evs.map(evHtml).join("") : '<div class="empty" style="padding:6px;font-size:12px">—</div>';
    html += '</div>';
  }
  html += '</div>';
  document.getElementById("view").innerHTML = html;
}

function renderDay(){
  var ds = iso(cursor), evs = eventsOn(ds);
  document.getElementById("periodLabel").textContent =
    DOWS[cursor.getDay()]+", "+MONTHS[cursor.getMonth()]+" "+cursor.getDate()+", "+cursor.getFullYear();
  var html = '<div class="daylist">';
  html += evs.length ? evs.map(evHtml).join("") : '<div class="empty">Nothing scheduled — enjoy the day off. 🎉</div>';
  html += '</div>';
  document.getElementById("view").innerHTML = html;
}

/* ============ NAVIGATION ============ */
function clamp(){
  if (cursor < MIN) cursor = new Date(MIN.getTime());
  if (cursor > MAX) cursor = new Date(MAX.getTime());
}
function step(n){
  if (view === "month") cursor = new Date(cursor.getFullYear(), cursor.getMonth()+n, 1);
  else if (view === "week") cursor = addDays(cursor, 7*n);
  else cursor = addDays(cursor, n);
  clamp(); render();
}
document.getElementById("prev").addEventListener("click", function(){ step(-1); });
document.getElementById("next").addEventListener("click", function(){ step(1); });
document.getElementById("today").addEventListener("click", function(){ cursor = new Date(today.getTime()); render(); });
document.querySelector(".seg").addEventListener("click", function(e){
  var b = e.target.closest("button[data-view]"); if(!b) return;
  view = b.getAttribute("data-view"); render();
});
document.getElementById("jump").addEventListener("click", function(){
  var v = window.prompt("Jump to a date (YYYY-MM-DD)\nAnything from "+iso(MIN)+" to "+iso(MAX)+":", iso(cursor));
  if (!v) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast("Use the format YYYY-MM-DD"); return; }
  cursor = parseISO(v); clamp(); render();
});
document.getElementById("filters").addEventListener("click", function(e){
  var b = e.target.closest(".chipf"); if(!b) return;
  var k = b.getAttribute("data-kid") || b.getAttribute("data-act");
  filters[k] = !filters[k];
  b.setAttribute("aria-pressed", filters[k] ? "true":"false");
  render();
});
document.addEventListener("keydown", function(e){
  if (document.getElementById("app").style.display !== "block") return;
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "m") { view="month"; render(); }
  else if (e.key === "w") { view="week"; render(); }
  else if (e.key === "d") { view="day"; render(); }
  else if (e.key === "Escape") { closeModal(); closeAddModal(); }
});

/* ============ ADD EVENT (scan / paste → confirm → save) ============ */
function monthIndex(s){
  var names = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  return names.indexOf(s.toLowerCase().slice(0,3));
}
function to24(s){
  var m = String(s||"").trim().toLowerCase().match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
  if (!m) return "";
  var h = +m[1], min = m[2] || "00", ap = m[3];
  if (ap === "pm" && h !== 12) h += 12;
  if (ap === "am" && h === 12) h = 0;
  return pad(h) + ":" + min;
}
function addHour(hhmm){
  if (!hhmm) return "";
  var p = hhmm.split(":");
  return pad((+p[0]+1) % 24) + ":" + p[1];
}
function extractDate(text){
  var m = text.match(/\b(20\d{2})-(\d{1,2})-(\d{1,2})\b/);
  if (m) return m[1] + "-" + pad(+m[2]) + "-" + pad(+m[3]);
  m = text.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/);
  if (m){
    var yr = m[3].length === 2 ? "20" + m[3] : m[3];
    return yr + "-" + pad(+m[1]) + "-" + pad(+m[2]);
  }
  var monthRe = "(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)";
  m = text.match(new RegExp(monthRe + "\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s*(\\d{4}))?", "i"));
  if (m){
    var mi = monthIndex(m[1]);
    if (mi >= 0) return (m[3] ? +m[3] : today.getFullYear()) + "-" + pad(mi+1) + "-" + pad(+m[2]);
  }
  return "";
}
function extractTimes(text){
  var m = text.match(/(\d{1,2}(?::\d{2})?)\s*(am|pm)?\s*(?:-|–|—|to)\s*(\d{1,2}(?::\d{2})?)\s*(am|pm)/i);
  if (m) return { start: to24(m[1] + " " + (m[2]||m[4])), end: to24(m[3] + " " + m[4]) };
  m = text.match(/\b(\d{1,2}(?::\d{2})?)\s*(am|pm)\b/i);
  if (m){ var st = to24(m[1] + " " + m[2]); return { start: st, end: addHour(st) }; }
  return { start:"", end:"" };
}
function parseScannedText(text){
  text = text || "";
  var out = { kid:"", act:"other", type:"", title:"", date:"", start:"", end:"", venue:"", venueName:"", venueAddr:"", field:"", jersey:"", arrive:"", parking:"", notes:"" };

  if (/julian/i.test(text)) out.kid = "julian";
  else if (/scarlett/i.test(text)) out.kid = "scarlett";

  if (/taekwondo/i.test(text)) out.act = "taekwondo";
  else if (/dance|recital|ballet/i.test(text)) out.act = "dance";
  else if (/soccer|\bfc\b|futbol/i.test(text)) out.act = "soccer";

  if (/\bgame\b/i.test(text)) out.type = "Game";
  else if (/\bpractice\b/i.test(text)) out.type = "Practice";
  else if (/\btournament\b/i.test(text)) out.type = "Tournament";
  else if (/\brecital\b/i.test(text)) out.type = "Recital";
  else if (/\bcompetition\b/i.test(text)) out.type = "Competition";
  else if (out.act === "taekwondo" && /\btest(ing)?\b/i.test(text)) out.type = "Test";

  out.date = extractDate(text);
  var times = extractTimes(text);
  out.start = times.start; out.end = times.end;

  var lower = text.toLowerCase();
  Object.keys(VENUES).forEach(function(vk){
    var v = VENUES[vk];
    if (v.name && lower.indexOf(v.name.toLowerCase()) !== -1) out.venue = vk;
  });
  if (!out.venue){
    if (/speedway/i.test(text)) out.venue = "sv";
    else if (/lsf|lincoln sports/i.test(text)) out.venue = "lsf";
    else if (/fremont/i.test(text)) out.venue = "fremont";
  }

  var fieldMatch = text.match(/field\s*#?\s*([0-9]{1,3}\s*[a-z]{0,3}(?:\s*(?:north|south|east|west|mw|nw|ne|se))?)/i);
  if (fieldMatch) out.field = "Field " + fieldMatch[1].trim();

  var jerseyMatch = text.match(/\b(navy|white|black|red|blue|gold|yellow|green|orange|gray|grey)\b[^.\n]{0,10}jersey/i);
  if (jerseyMatch) out.jersey = jerseyMatch[1][0].toUpperCase() + jerseyMatch[1].slice(1).toLowerCase() + " jersey";

  var arriveMatch = text.match(/arrive[^0-9]{0,12}(\d{1,2}(?::\d{2})?\s*(?:am|pm)?)/i);
  if (arriveMatch) out.arrive = to24(arriveMatch[1]);

  var vsMatch = text.match(/(away\s*@|home\s*vs\.?|vs\.?|versus|@)\s*([A-Za-z0-9 .&'-]{3,45})/i);
  if (vsMatch) out.title = vsMatch[0].trim().replace(/\s+/g," ");

  return out;
}

      + Object.keys(ACTS).map(function(ak){ return '<option value="'+ak+'"'+(p.act===ak?" selected":"")+'>'+ACTS[ak].emoji+" "+ACTS[ak].label+'</option>'; }).join("")
      + '</select></div>'
      + '<div class="field"><label>Type</label><input name="type" list="typeList" value="'+esc(p.type)+'" placeholder="Game, Practice…"></div>'
      + '</div>'
      + '<datalist id="typeList"><option value="Game"><option value="Practice"><option value="Tournament"><option value="Recital"><option value="Test"><option value="Competition"></datalist>'
      + '<div class="field"><label>Title</label><input name="title" value="'+esc(p.title)+'" placeholder="e.g. Away @ EFC — Eagles FC U8"></div>'
      + '<div class="field-row">'
      + '<div class="field"><label>Date</label><input type="date" name="date" value="'+esc(p.date)+'"></div>'
      + '<div class="field"><label>Start – End</label><div style="display:flex;gap:8px"><input type="time" name="start" value="'+esc(p.start)+'"><input type="time" name="end" value="'+esc(p.end)+'"></div></div>'
      + '</div>'
      + '<div class="field"><label>Venue</label><select name="venue" data-action="venue-select"><option value="">Choose…</option>'+venueOptions+'</select></div>';
    if (p.venue === "__custom__"){
      html += '<div class="field-row">'
        + '<div class="field"><label>Venue name</label><input name="venueName" value="'+esc(p.venueName)+'"></div>'
        + '<div class="field"><label>Address</label><input name="venueAddr" value="'+esc(p.venueAddr)+'"></div>'
        + '</div>';
    }
    html += '<div class="field"><label>Field / court</label><input name="field" value="'+esc(p.field)+'" placeholder="e.g. Field 9 C"></div>'
      + '<div class="field-row">'
      + '<div class="field"><label>Jersey / wear</label><input name="jersey" value="'+esc(p.jersey)+'" placeholder="e.g. Navy jersey"></div>'
      + '<div class="field"><label>Arrive by</label><input type="time" name="arrive" value="'+esc(p.arrive)+'"></div>'
      + '</div>'
      + '<div class="field"><label>Parking</label><input name="parking" value="'+esc(p.parking)+'"></div>'
      + '<div class="field"><label>Notes</label><textarea name="notes" rows="2">'+esc(p.notes)+'</textarea></div>';
    if (s.rawText) html += '<button type="button" class="raw-text-toggle" data-action="toggle-raw">'+(s.showRaw?"Hide":"Show")+' scanned text</button>';
    if (s.showRaw) html += '<div class="raw-text-box">'+esc(s.rawText)+'</div>';
    if (s.error) html += '<div class="err-msg">'+esc(s.error)+'</div>';
    html += '<div class="actions"><button type="button" class="btn" data-action="back">‹ Back</button><button type="button" class="btn primary" data-action="save">Save event</button></div>';
  }
  else if (s.step === "saving"){
    html = '<div class="progress-wrap"><div class="spinner"></div>Saving…</div>';
  }
  else if (s.step === "done"){
    if (s.saveOk){
      html = '<div class="progress-wrap">✅ Saved! It\'ll appear for both of you within about a minute.</div>'
        + '<div class="actions"><button type="button" class="btn primary wide" data-action="close-add">Done</button></div>';
    } else {
      html = '<div class="err-msg">'+esc(s.saveErrorMsg)+' It\'s showing on your calendar now, but only on this device until it\'s added to the shared file — copy the details below and send them over.</div>'
        + '<div class="raw-text-box">'+esc(JSON.stringify(s.pendingEvent, null, 2))+'</div>'
        + '<div class="actions"><button type="button" class="btn" data-action="copy-event-json">📋 Copy details</button><button type="button" class="btn primary" data-action="close-add">Done</button></div>';
    }
  }
  document.getElementById("addBody").innerHTML = html;
}

function handleFileChosen(file){
  if (!file) return;
  addState.file = file;
  if (addState.imageUrl) URL.revokeObjectURL(addState.imageUrl);
  addState.imageUrl = URL.createObjectURL(file);
  addState.error = "";
  renderAddModal();
}
function finishScan(text){
  addState.rawText = text;
  addState.parsed = parseScannedText(text);
  addState.step = "confirm";
  addState.showRaw = false;
  renderAddModal();
}
function handleScan(){
  if (addState.mode === "paste"){
    var ta = document.getElementById("pasteText");
    var txt = ta ? ta.value.trim() : "";
    if (!txt){ addState.error = "Paste some text first."; renderAddModal(); return; }
    finishScan(txt);
    return;
  }
  if (!addState.file){ addState.error = "Choose a screenshot first."; renderAddModal(); return; }
  if (typeof Tesseract === "undefined"){
    addState.error = "The scanner didn't load (check your connection) — try Paste text instead.";
    renderAddModal(); return;
  }
  addState.step = "scanning"; addState.error = ""; renderAddModal();
  Tesseract.recognize(addState.file, "eng")
    .then(function(res){ finishScan(res && res.data ? res.data.text : ""); })
    .catch(function(){
      addState.step = "input";
      addState.error = "Couldn't read that image — try Paste text instead.";
      renderAddModal();
    });
}
function handleSave(){
  var p = addState.parsed;
  if (!p.kid || !p.date || !p.start){
    addState.error = "Please fill in at least kid, date, and start time.";
    renderAddModal(); return;
  }
  var ev = {
    id: "u" + Date.now().toString(36),
    kid: p.kid, act: p.act || "other", type: p.type || "",
    title: p.title || (ACTS[p.act || "other"].label),
    date: p.date, start: p.start, end: p.end || addHour(p.start),
    venue: p.venue === "__custom__" ? "" : (p.venue || ""),
    field: p.field || "", jersey: p.jersey || "", arrive: p.arrive || "",
    parking: p.parking || "", notes: p.notes || ""
  };
  if (p.venue === "__custom__"){ ev.venueName = p.venueName || ""; ev.venueAddr = p.venueAddr || ""; }

  addState.pendingEvent = ev;
  addState.step = "saving"; addState.error = ""; renderAddModal();

  saveEventToGitHub(ev)
    .then(function(){
      EVENTS.push(ev);
      try { localStorage.setItem(EVENTS_CACHE_KEY, JSON.stringify(EVENTS)); } catch(e){}
      addState.step = "done"; addState.saveOk = true; renderAddModal(); render();
    })
    .catch(function(err){
      EVENTS.push(ev);
      try { localStorage.setItem(EVENTS_CACHE_KEY, JSON.stringify(EVENTS)); } catch(e){}
      addState.step = "done"; addState.saveOk = false;
      addState.saveErrorMsg = (err && err.message === "no-token") ? "Auto-save isn't set up yet." : "Couldn't save automatically.";
      renderAddModal(); render();
    });
}

document.getElementById("ghSetupBtn").addEventListener("click", function(){
  var current = getGhToken();
  var v = window.prompt(
    "Paste a GitHub token to enable auto-save on THIS device (leave blank + OK to clear).\n\n" +
    "Stored only in this browser — never sent anywhere but GitHub's API, never saved to the repo.",
    current
  );
  if (v === null) return;
  v = v.trim();
  if (setGhToken(v)) toast(v ? "Auto-save enabled on this device" : "Auto-save token cleared");
  else toast("Couldn't save — storage blocked in this browser");
});
document.getElementById("addEventBtn").addEventListener("click", openAddModal);
document.getElementById("addClose").addEventListener("click", closeAddModal);
document.getElementById("addModal").addEventListener("click", function(e){
  if (e.target === document.getElementById("addModal")) closeAddModal();
});
document.getElementById("addBody").addEventListener("click", function(e){
  var el;
  if ((el = e.target.closest("[data-action='mode']"))){ addState.mode = el.getAttribute("data-mode"); renderAddModal(); return; }
  if ((el = e.target.closest("[data-action='pick-file']"))){ document.getElementById("fileInput").click(); return; }
  if ((el = e.target.closest("[data-action='scan']"))){ handleScan(); return; }
  if ((el = e.target.closest("[data-action='back']"))){ collectFormValues(); addState.step = "input"; renderAddModal(); return; }
  if ((el = e.target.closest("[data-action='save']"))){ collectFormValues(); handleSave(); return; }
  if ((el = e.target.closest("[data-action='toggle-raw']"))){ addState.showRaw = !addState.showRaw; renderAddModal(); return; }
  if ((el = e.target.closest("[data-action='copy-event-json']"))){ copyText(JSON.stringify(addState.pendingEvent, null, 2), "Event details copied"); return; }
  if ((el = e.target.closest("[data-action='close-add']"))){ closeAddModal(); return; }
});
document.getElementById("addBody").addEventListener("change", function(e){
  if (e.target.id === "fileInput"){ handleFileChosen(e.target.files[0]); return; }
  if (e.target.name === "venue"){ collectFormValues(); renderAddModal(); }
});

/* ============ BOOT ============ */
try { if (localStorage.getItem(KEY) === "1") unlock(); } catch(e){}
document.getElementById("code").focus();
})();
</script>
